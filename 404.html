<!DOCTYPE html>
<html lang="es-PY">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Grúas Paraguay | gruas.com.py</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --surface:#F7F8FA; --text:#0F1317; --muted:#59626C;
  --accent:#DC2626; --border:#E4E7EB; --wa:#25D366; --wa-dark:#1EBE5A;
  --r:14px; --r-sm:12px;
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.06);
  --ease:cubic-bezier(0.16,1,0.3,1);
}
*,*::before,*::after{ box-sizing:border-box; }
body{
  margin:0; font-family:'Inter',system-ui,sans-serif; color:var(--text);
  background:var(--surface); font-size:17px; line-height:1.55;
  min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px;
}
.card{
  background:#fff; border:1px solid var(--border); border-radius:var(--r);
  box-shadow:var(--shadow); padding:clamp(32px,6vw,56px); max-width:560px; width:100%;
}
.code{ font-weight:800; font-size:64px; line-height:1; color:var(--accent); margin-bottom:12px; }
h1{ font-weight:800; font-size:clamp(26px,4vw,36px); line-height:1.1; margin:0 0 16px; }
p{ margin:0 0 16px; color:var(--muted); }
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:10px;
  min-height:56px; padding:14px 28px; border-radius:var(--r-sm);
  font-weight:800; font-size:17px; text-decoration:none; border:2px solid transparent;
  transition:transform .15s var(--ease);
}
.btn:hover{ transform:translateY(-2px); }
.btn-wa{ background:var(--wa); color:#fff; }
.btn-wa:hover{ background:var(--wa-dark); }
.btn-call{ background:var(--accent); color:#fff; }
.cta-pair{ display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; }
@media (max-width:480px){ .cta-pair{ flex-direction:column; } .cta-pair .btn{ width:100%; } }
.links{ margin-top:28px; display:flex; flex-wrap:wrap; gap:16px; font-size:15px; font-weight:600; }
.links a{ color:var(--text); }
</style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>Esta página no existe</h1>
    <p>El enlace que seguiste no lleva a ninguna parte. Si necesitás una grúa ahora, no busques más: escribinos o llamanos.</p>

    <div class="cta-pair">
      <a class="btn btn-wa" href="https://wa.me/595995628862?text=Hola%2C%20vi%20su%20p%C3%A1gina%20web%20y%20necesito%20ayuda" target="_blank" rel="noopener">Escribinos por WhatsApp</a>
      <a class="btn btn-call" href="tel:+595995628862">Llamar ahora</a>
    </div>

    <div class="links">
      <a href="/">Inicio</a>
      <a href="/#servicios">Servicios</a>
      <a href="/#zonas">Zonas</a>
      <a href="/#contacto">Contacto</a>
    </div>
  </div>
</body>
</html>
